name: Static Architecture Verification

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - name: Run migration verifier
        run: dotnet run --project tools/CFIP.StaticVerifier/CFIP.StaticVerifier.csproj --configuration Release
      - name: Run core contract tests
        run: dotnet run --project tests/CFIP.CoreContractTests/CFIP.CoreContractTests.csproj --configuration Release

name: Runtime acceptance contracts

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - run: dotnet restore tools/CFIP.Runtime.Contracts/CFIP.Runtime.Contracts.csproj
      - run: dotnet build tools/CFIP.Runtime.Contracts/CFIP.Runtime.Contracts.csproj --configuration Release --no-restore
      - run: dotnet run --project tools/CFIP.Runtime.Contracts/CFIP.Runtime.Contracts.csproj --configuration Release --no-build

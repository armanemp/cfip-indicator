name: Source and architecture checks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/verify_architecture.py
      - run: python tools/audit_parameters.py
      - run: python tools/audit_parameter_count.py
      - run: python tools/audit_runtime_ui.py
      - run: python tools/audit_parameter_semantics.py
      - run: python tools/audit_project_integrity.py
      - run: python tools/audit_execution_capacity_semantics.py
      - run: python tools/audit_phase_accumulation.py
      - run: python tools/audit_optimization_readiness.py
      - run: python tools/audit_startup_persistence.py
      - run: python tools/audit_signal_measurement.py
      - run: python tools/audit_exit_geometry.py
      - run: python tools/audit_news_guard.py
      - run: python tools/audit_calculation_cycle.py
      - run: python tools/audit_hotpath_persistence.py
      - run: python tools/audit_cbot_boundary.py
      - run: python tools/audit_cbot_preflight.py
      - run: python tools/audit_phase_2_1.py
      - run: python tools/audit_phase_2_2.py
      - run: python tools/audit_phase_2_3.py
      - run: python tools/audit_phase_2_4.py
      - run: python tools/audit_phase_11_2.py
      - run: python tools/audit_phase_11_3.py
      - run: python tools/audit_phase_11_4.py
      - run: python tools/audit_phase_11_5.py
      - run: python tools/audit_phase_11_8.py

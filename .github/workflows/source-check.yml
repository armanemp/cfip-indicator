name: Source and architecture checks

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_github_workflows.py
      - run: python tools/audit_mtf_contract.py
      - run: python tools/audit_parameter_count.py
      - run: python tools/audit_cbot_project_boundary.py
      - run: python tools/audit_cbot_contract_schema.py
      - run: python tools/audit_cbot_preflight.py

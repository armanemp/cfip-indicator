name: Source checks

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("src/CFIP.Indicator")
          files = list(root.rglob("*.cs"))
          text = "\n".join(p.read_text(encoding="utf-8") for p in files)
          for pattern in (r"CFIPClean\d+", r"Clean\d+", r"\bv\d+\b", r"Migrated from", r"CFIP_MTF_LiveEntryEngine_Clean"):
              if re.search(pattern, text, re.I):
                  raise SystemExit("Forbidden project residue: "+pattern)
          if len(re.findall(r"\bpartial\s+class\s+CFIPIndicator\b", text)) < 2:
              raise SystemExit("Partial indicator modules are incomplete")
          parameters = len(re.findall(r"\[Parameter\s*\(", text))
          if parameters != 513:
              raise SystemExit(f"Expected 513 parameters, found {parameters}")
          if re.search(r"\b(?:Buy|Sell)\b.{0,80}\b(?:Button|ToggleButton)\b", text, re.I):
              raise SystemExit("Manual trade-entry button surface detected")
          print(f"Checked {len(files)} C# files; {parameters} parameters; clean naming.")
          PY

name: cTrader compile

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      - run: dotnet restore src/CFIP.Contracts/CFIP.Contracts.csproj
      - run: dotnet build src/CFIP.Contracts/CFIP.Contracts.csproj --configuration Release --no-restore
      - run: dotnet restore src/CFIP.cBot/CFIP.cBot.csproj
      - run: dotnet build src/CFIP.cBot/CFIP.cBot.csproj --configuration Release --no-restore

      - run: dotnet restore tools/CFIP.Indicator.CI/CFIP.Indicator.CI.csproj
      - run: dotnet build tools/CFIP.Indicator.CI/CFIP.Indicator.CI.csproj --configuration Release --no-restore
      - run: dotnet restore tools/CFIP.Decision.Contracts/CFIP.Decision.Contracts.csproj
      - run: dotnet build tools/CFIP.Decision.Contracts/CFIP.Decision.Contracts.csproj --configuration Release --no-restore
      - run: dotnet run --project tools/CFIP.Decision.Contracts/CFIP.Decision.Contracts.csproj --configuration Release --no-build
      - run: dotnet restore tools/CFIP.Planning.Contracts/CFIP.Planning.Contracts.csproj
      - run: dotnet build tools/CFIP.Planning.Contracts/CFIP.Planning.Contracts.csproj --configuration Release --no-restore
      - run: dotnet run --project tools/CFIP.Planning.Contracts/CFIP.Planning.Contracts.csproj --configuration Release --no-build
      - run: dotnet restore tools/CFIP.Execution.Contracts/CFIP.Execution.Contracts.csproj
      - run: dotnet build tools/CFIP.Execution.Contracts/CFIP.Execution.Contracts.csproj --configuration Release --no-restore
      - run: dotnet run --project tools/CFIP.Execution.Contracts/CFIP.Execution.Contracts.csproj --configuration Release --no-build

      - run: dotnet restore tools/CFIP.cBot.Shadow.Tests/CFIP.cBot.Shadow.Tests.csproj
      - run: dotnet build tools/CFIP.cBot.Shadow.Tests/CFIP.cBot.Shadow.Tests.csproj --configuration Release --no-restore
      - run: dotnet run --project tools/CFIP.cBot.Shadow.Tests/CFIP.cBot.Shadow.Tests.csproj --configuration Release --no-build
      - run: dotnet restore preflight/CFIP.Preflight.Probe.csproj
      - run: dotnet build preflight/CFIP.Preflight.Probe.csproj --configuration Release --no-restore
      - run: dotnet restore preflight/CFIP.Preflight.csproj
      - run: dotnet build preflight/CFIP.Preflight.csproj --configuration Release --no-restore
